<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <title>EVAC-120 Warden</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body class="warden">
  <div class="safety-notice" id="safety"></div>
  <header class="bar">
    <h1 id="zone-title">—</h1>
    <span class="spacer"></span>
    <button id="lang">العربية</button>
  </header>

  <main>
    <div id="sync" class="warden-status online"></div>
    <!-- Refusals in full, not a count of them. A warden who cannot see which
         action was refused cannot do anything about it. -->
    <div id="sync-problems"></div>

    <div id="system-health"></div>

    <div class="tabs" id="tabs"></div>

    <section id="screen-zone">
      <div class="tiles" id="zone-tiles"></div>
      <!-- The question above the field rather than inside it. As a
           placeholder it was set in a 36px numeral face and ran off the end of
           the input, so a warden saw "How many people can you c" and a box
           that looked broken. -->
      <label class="field-label" id="headcount-label" for="headcount"></label>
      <div class="headcount-entry">
        <input id="headcount" type="number" inputmode="numeric" min="0"
               placeholder="0">
        <button class="primary" id="submit-count"></button>
      </div>
      <div id="mismatch"></div>
      <button class="primary" id="sweep" style="width:100%;min-height:56px"></button>
      <button id="escalate" style="width:100%;min-height:56px;margin-top:8px"></button>
      <button id="note" style="width:100%;min-height:56px;margin-top:8px"></button>
      <div id="composer" hidden>
        <textarea id="composer-text" rows="3"
                  style="width:100%;min-height:72px"></textarea>
        <div id="composer-hint" class="caveat"></div>
        <div class="person-actions">
          <button class="primary" id="composer-send"></button>
          <button id="composer-cancel"></button>
        </div>
      </div>
    </section>

    <section id="screen-roster" hidden>
      <input class="search" id="search" type="search">
      <div id="roster"></div>
    </section>

    <section id="screen-unknown" hidden>
      <div class="body" id="unknown-body"></div>
    </section>
  </main>

  <script type="module" src="/static/js/warden.js"></script>
</body>
</html>
