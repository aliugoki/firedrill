<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVAC-120 Command Centre</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="safety-notice" id="safety"></div>
  <header class="bar">
    <h1 id="title">EVAC-120</h1>
    <span id="drill-name"></span>
    <span id="drill-status" class="chip"></span>
    <button id="drill-action" hidden></button>
    <span class="spacer"></span>
    <span id="elapsed" style="font-variant-numeric:tabular-nums"></span>
    <span id="health"></span>
    <button id="lang">العربية</button>
  </header>

  <main>
    <div id="stale-banner"></div>
    <!-- Beside the stale banner because it is the same kind of message: not
         what the board says, but how far to believe it. The strip in the
         header has room for a state and none for a sentence. -->
    <div id="health-caveat"></div>
    <section id="verdict" class="verdict not-clear">
      <h2>—</h2>
      <ul></ul>
    </section>

    <!-- The number that has to reach zero, and whether it is falling. It was
         on none of the seven tiles: "expected" and "accounted for" were both
         there and the difference was not. -->
    <section class="headline" id="headline"></section>

    <section class="tiles" id="tiles"></section>

    <!-- Two bands, and the split is the point. `act` is what somebody does
         something about in the next minute; `reference` is what they read
         afterwards. Every panel used to carry the same small grey heading, so
         a dispatch list and a percentile table looked like the same kind of
         thing. -->
    <div class="grid">
      <div>
        <!-- Where to send somebody, above who is missing. The same people
             grouped by where they were last seen is a dispatch list; the list
             of names is a log. -->
        <div class="panel act" id="search-panel">
          <h3 data-icon="search"><span id="search-title">Where to look</span>
            <span class="panel-count" id="search-count"></span></h3>
          <div id="search"></div>
        </div>
        <div class="panel act">
          <h3 data-icon="alert"><span id="priority-title">Needs attention</span>
            <span class="panel-count" id="priority-count"></span></h3>
          <div id="priority"></div>
        </div>
      </div>
      <div>
        <div class="panel act">
          <h3 data-icon="zone"><span id="zones-title">Assembly zones</span>
            <span class="panel-count" id="zones-count"></span></h3>
          <div id="zones"></div>
        </div>
        <div class="panel reference">
          <h3 data-icon="exit"><span id="exits-title">Exits</span></h3>
          <div class="body" id="exits"></div>
        </div>
        <!-- Last while a drill is running. A percentile is a post-drill
             measure and nobody dispatches anybody on one; it held the top of
             this column above the two panels that are operational. -->
        <div class="panel reference">
          <h3 data-icon="clock"><span id="timing-title">Evacuation times</span></h3>
          <div class="body" id="timing"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="drawer-host"></div>
  <script type="module" src="/static/js/command.js"></script>
</body>
</html>
